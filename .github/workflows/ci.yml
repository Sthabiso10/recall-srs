name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch; no point burning minutes on a
# commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The core has zero dependencies and claims to run anywhere. Test that
        # claim across the versions we say we support in `engines`.
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm build

      # "Zero dependencies, small core" is a claim the README makes. Budgets
      # turn it into a build failure instead of a thing nobody checks.
      - name: Bundle size
        if: matrix.node == 20
        run: pnpm size

      # The published react bundle must carry the `use client` directive or it
      # breaks every Next.js App Router consumer. This regressed once already.
      - name: Verify package contents
        run: |
          head -1 packages/react/dist/index.js | grep -q "use client" \
            || { echo "::error::use client directive missing from ESM bundle"; exit 1; }
          head -1 packages/react/dist/index.cjs | grep -q "use client" \
            || { echo "::error::use client directive missing from CJS bundle"; exit 1; }
